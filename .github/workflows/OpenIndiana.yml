name: OpenIndiana Makefile

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: '2026.10.30', current: true , deps: sys   }

    concurrency:
      group: ${{github.ref}}-${{github.workflow}}-${{matrix.version}}-${{matrix.current}}-${{matrix.deps}}
      cancel-in-progress: true

    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Startup VM
      uses: cross-platform-actions/action@7037457d8fb8a439e85b4a6da7b4b44566523be0
      with:
        architecture: x86_64
        memory: 4G
        operating_system: openindiana
        version: ${{matrix.version}}
        shell: bash
        sync_files: false
    - name: Sync files to VM
      shell: cpa.sh {0} --sync-files runner-to-vm
      run: true
    - name: Info
      shell: cpa.sh {0} --sync-files none
      run: |
        sudo df -h
        sudo zpool list
        sudo zfs list
        sudo zpool status
        sudo zfs get compression,compressratio rpool
        sudo zfs get compression,compressratio rpool/ROOT
        sudo zfs get compression,compressratio rpool/ROOT/openindiana
        sudo zfs get compression,compressratio rpool/ROOT/openindiana/var
        sudo zfs get compression,compressratio rpool/export
        sudo zfs get compression,compressratio rpool/export/home
        sudo zfs get compression,compressratio rpool/export/home/runner
    - name: Update system
      if: matrix.current
      shell: cpa.sh {0} --sync-files none
      run: |
        sudo pkg update --accept
    - name: Reboot VM
      if: matrix.current
      shell: cpa.sh {0} --sync-files none --reboot
      run: true
    - name: Install beadm
      shell: cpa.sh {0} --sync-files none --reboot
      run: |
        sudo pkg install install/beadm
    - name: Cleanup build environments
      if: matrix.current
      run: |
        sudo beadm list -H
        sudo beadm list -H | awk -F';' '$3 !~ /[NR]/ {print $1}' | head -n -2 | xargs -r -n 1 sudo beadm destroy -F
    - name: Install dependencies
      shell: cpa.sh {0} --sync-files none
      run: |
        sudo pkg install --accept metapackages/build-essential developer/versioning/subversion developer/versioning/git text/gawk developer/build/gnu-make developer/build/pkg-config audio/mpg123 library/libogg library/libvorbis codec/flac library/libsndfile library/sdl2 developer/build/autoconf developer/build/autoconf-archive developer/build/automake developer/build/libtool library/libtool/libltdl developer/build/help2man developer/documentation-tool/doxygen library/audio/pulseaudio
    - name: Reboot VM
      shell: cpa.sh {0} --sync-files none --reboot
      run: true
